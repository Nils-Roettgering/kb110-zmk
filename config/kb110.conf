# kb110 - wireless full-size keyboard on nice!nano v2
#
# The custom duplex-matrix kscan driver (zmk,kscan-gpio-duplex) is selected
# automatically by devicetree. Its tunables (debounce, poll periods) live in
# boards/shields/kb110/kb110.overlay.
#
# Deep sleep (CONFIG_ZMK_SLEEP) is intentionally left disabled: a duplex matrix
# cannot be woken from power-off by arbitrary key presses (no drive lines are
# powered while suspended). If you enable it anyway, pair it with
# zmk,gpio-key-wakeup-trigger on pins you know are safe, or use the encoder /
# reset button to wake.

# Report battery level every 30 minutes instead of continuously.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=1800

# Rotary encoder (EC11). The trigger mode must be set explicitly: without it
# the encoder driver never raises events.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
